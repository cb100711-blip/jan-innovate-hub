<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

```
<title>Login | Innovation Portal</title>

<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

<header class="navbar">

```
<a href="index.html" class="logo">
    💡 Innovation Portal
</a>

<nav>
    <a href="index.html">Home</a>
    <a href="problems.html">Problems</a>
    <a href="submit.html">Submit Problem</a>
    <a href="signup.html" class="nav-btn">
        Sign Up
    </a>
</nav>
```

</header>

<section class="auth-section">

```
<div class="auth-box">

    <div class="auth-icon">
        🔐
    </div>

    <h1>Welcome Back</h1>

    <p>
        Login to your Innovation Portal account.
    </p>


    <form id="loginForm">

        <div class="form-group">

            <label>
                Email Address *
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required>

        </div>


        <div class="form-group">

            <label>
                Password *
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>

        </div>


        <button
            type="submit"
            class="submit-btn">

            Login

        </button>

    </form>


    <div id="loginMessage"></div>


    <p class="auth-link">

        Don't have an account?

        <a href="signup.html">
            Create Account
        </a>

    </p>

</div>
```

</section>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
        document.getElementById(
            "loginEmail"
        ).value;


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    try {

        const response =
            await fetch(
                "https://jan-innovate-hub.onrender.com/api/login",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })

                }
            );


        const result =
            await response.json();


        if (result.success) {

            message.innerHTML =
                "✅ Login successful!";

            message.style.color =
                "green";


            // Save logged-in user

            localStorage.setItem(
                "user",
                JSON.stringify(result.user)
            );


            // Go to home page

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 1000);

        }

        else {

            message.innerHTML =
                "❌ " +
                result.message;

            message.style.color =
                "red";

        }


    }

    catch (error) {

        console.error(error);

        message.innerHTML =
            "❌ Backend connection failed!";

        message.style.color =
            "red";

    }

});

</script>

</body>
</html>
