<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Problems | Innovation Portal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="navbar">
    <a href="index.html" class="logo">💡 Innovation Portal</a>

```
<nav>
    <a href="index.html">Home</a>
    <a href="problems.html" class="active">Problems</a>
    <a href="submit.html">Submit Problem</a>
    <a href="login.html">Login</a>
    <a href="signup.html" class="nav-btn">Sign Up</a>
</nav>
```

</header>

<section class="page-header">
    <h1>Explore Community Problems</h1>
    <p>Discover real-world challenges submitted by communities.</p>
</section>

<section class="problem-section">

```
<div class="filters">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search problems..."
    >

    <select id="filterCategory">
        <option value="">All Categories</option>
        <option value="Education">Education</option>
        <option value="Healthcare">Healthcare</option>
        <option value="Agriculture">Agriculture</option>
        <option value="Water Management">Water Management</option>
        <option value="Sanitation">Sanitation</option>
        <option value="Environment">Environment</option>
        <option value="Rural Development">Rural Development</option>
    </select>

    <select id="filterImpact">
        <option value="">All Impact Levels</option>
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Critical">Critical</option>
    </select>

</div>


<!-- BACKEND PROBLEMS WILL APPEAR HERE -->

<div class="problem-grid" id="problemList">

    <p id="loadingMessage">Loading problems...</p>

</div>
```

</section>

<footer>
    <p>© 2026 Innovation Portal | SIH26043</p>
</footer>

<script>

let allProblems = [];


// =====================================
// LOAD PROBLEMS FROM BACKEND
// =====================================

async function loadProblems() {

    const container =
        document.getElementById("problemList");

    try {

        const response =
            await fetch("http://localhost:5000/api/problems");

        const result =
            await response.json();

        if (!result.success) {

            container.innerHTML =
                "<p>Problems load heiparila.</p>";

            return;
        }

        allProblems = result.problems;

        displayProblems();

    } catch (error) {

        console.error(
            "Backend connection failed:",
            error
        );

        container.innerHTML =
            "<p>Backend connection failed!</p>";
    }
}


// =====================================
// DISPLAY PROBLEMS
// =====================================

function displayProblems() {

    const container =
        document.getElementById("problemList");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const category =
        document.getElementById("filterCategory")
        .value;

    const impact =
        document.getElementById("filterImpact")
        .value;


    const filteredProblems =
        allProblems.filter(problem => {

            const title =
                (problem.title || "")
                .toLowerCase();

            const description =
                (problem.description || "")
                .toLowerCase();


            const matchesSearch =
                title.includes(search) ||
                description.includes(search);


            const matchesCategory =
                !category ||
                problem.category === category;


            const matchesImpact =
                !impact ||
                problem.impact === impact;


            return (
                matchesSearch &&
                matchesCategory &&
                matchesImpact
            );

        });


    container.innerHTML = "";


    if (filteredProblems.length === 0) {

        container.innerHTML =
            "<p>No problems submitted yet.</p>";

        return;
    }


    filteredProblems.forEach(problem => {

        const card =
            document.createElement("div");

        card.className =
            "problem-card";


        card.dataset.category =
            problem.category || "";

        card.dataset.impact =
            problem.impact || "";


        let impactClass =
            (problem.impact || "")
            .toLowerCase();


        card.innerHTML = `

            <span class="tag">
                ${problem.category || "General"}
            </span>

            <span class="impact ${impactClass}">
                ${problem.impact || "Not specified"}
            </span>

            <h3>
                ${problem.title}
            </h3>

            <p>
                ${problem.description}
            </p>

            <div class="card-location">
                📍 ${problem.district || problem.state || "India"}
            </div>

            <p>
                <strong>Status:</strong>
                ${problem.status || "Pending"}
            </p>

            <a
                href="details.html?id=${problem.id}"
                class="view-btn"
            >
                View Details →
            </a>

        `;


        container.appendChild(card);

    });

}


// =====================================
// SEARCH
// =====================================

document
    .getElementById("search")
    .addEventListener(
        "input",
        displayProblems
    );


// =====================================
// CATEGORY FILTER
// =====================================

document
    .getElementById("filterCategory")
    .addEventListener(
        "change",
        displayProblems
    );


// =====================================
// IMPACT FILTER
// =====================================

document
    .getElementById("filterImpact")
    .addEventListener(
        "change",
        displayProblems
    );


// =====================================
// START
// =====================================

loadProblems();

</script>

</body>
</html>
