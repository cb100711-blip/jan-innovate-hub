<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Submit Problem - Jan-Innovate Hub
</title>

<style>

body {

    margin: 0;

    font-family:
        Arial,
        sans-serif;

    background:
        #f5f7fb;

}

nav {

    background:
        #1e3a8a;

    color:
        white;

    padding:
        18px 30px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

}

nav a {

    color:
        white;

    text-decoration:
        none;

    margin-left:
        20px;

}

.container {

    max-width:
        800px;

    margin:
        35px auto;

    padding:
        20px;

}

.form-box {

    background:
        white;

    padding:
        30px;

    border-radius:
        12px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

}

h1 {

    margin-top:
        0;

}

label {

    display:
        block;

    margin-top:
        18px;

    margin-bottom:
        7px;

    font-weight:
        bold;

}

input,
select,
textarea {

    width:
        100%;

    padding:
        12px;

    border:
        1px solid #ccc;

    border-radius:
        7px;

    box-sizing:
        border-box;

    font-size:
        15px;

}

textarea {

    min-height:
        120px;

    resize:
        vertical;

}

button {

    margin-top:
        25px;

    width:
        100%;

    padding:
        14px;

    border:
        none;

    border-radius:
        8px;

    background:
        #1e3a8a;

    color:
        white;

    font-size:
        16px;

    cursor:
        pointer;

}

button:hover {

    opacity:
        0.9;

}

button:disabled {

    opacity:
        0.6;

    cursor:
        not-allowed;

}


/* AI BUTTON */

#aiButton {

    background:
        #7c3aed;

}


/* AI BOX */

#aiResult {

    display:
        none;

    margin-top:
        20px;

    padding:
        18px;

    background:
        #f3f0ff;

    border:
        1px solid #c4b5fd;

    border-radius:
        10px;

}

.ai-title {

    font-size:
        18px;

    font-weight:
        bold;

    margin-bottom:
        12px;

}

.ai-item {

    margin:
        10px 0;

}

.ai-badge {

    display:
        inline-block;

    padding:
        5px 10px;

    border-radius:
        20px;

    background:
        #ede9fe;

    color:
        #5b21b6;

    font-weight:
        bold;

}


/* DUPLICATE BOX */

#duplicateResult {

    display:
        none;

    margin-top:
        20px;

    padding:
        18px;

    border-radius:
        10px;

}

.duplicate {

    background:
        #fff3cd;

    border:
        1px solid #ffc107;

    color:
        #856404;

}

.unique {

    background:
        #d4edda;

    border:
        1px solid #28a745;

    color:
        #155724;

}

.duplicate-title {

    font-size:
        18px;

    font-weight:
        bold;

    margin-bottom:
        10px;

}


/* MESSAGE */

#message {

    margin-top:
        20px;

    padding:
        12px;

    border-radius:
        7px;

    display:
        none;

}

.success {

    background:
        #d4edda;

    color:
        #155724;

}

.error {

    background:
        #f8d7da;

    color:
        #721c24;

}

</style>

</head>


<body>


<nav>

<strong>
    Jan-Innovate Hub
</strong>

<div>

<a href="index.html">
    Home
</a>

<a href="problems.html">
    Problems
</a>

<a href="my-problems.html">
    My Problems
</a>

</div>

</nav>



<div class="container">

<div class="form-box">


<h1>
    Submit a Problem
</h1>

<p>
    Share a local or societal problem
    that needs an innovative solution.
</p>



<form id="problemForm">


<!-- TITLE -->

<label>
    Problem Title *
</label>

<input
    type="text"
    name="title"
    id="title"
    placeholder="Example: Drinking Water Problem"
    required
>



<!-- CATEGORY -->

<label>
    Category *
</label>

<select
    name="category"
    id="category"
    required
>

<option value="">
    Select Category
</option>

<option value="Education">
    Education
</option>

<option value="Healthcare">
    Healthcare
</option>

<option value="Agriculture">
    Agriculture
</option>

<option value="Water">
    Water
</option>

<option value="Sanitation">
    Sanitation
</option>

<option value="Environment">
    Environment
</option>

<option value="Infrastructure">
    Infrastructure
</option>

<option value="Other">
    Other
</option>

</select>



<!-- IMPACT -->

<label>
    Impact
</label>

<select
    name="impact"
    id="impact"
>

<option value="">
    Select Impact
</option>

<option value="Low">
    Low
</option>

<option value="Medium">
    Medium
</option>

<option value="High">
    High
</option>

</select>



<!-- STATE -->

<label>
    State
</label>

<input
    type="text"
    name="state"
    placeholder="Example: Odisha"
>



<!-- DISTRICT -->

<label>
    District
</label>

<input
    type="text"
    name="district"
    placeholder="Example: Cuttack"
>



<!-- LOCATION -->

<label>
    Location
</label>

<input
    type="text"
    name="location"
    placeholder="Village / City / Area"
>



<!-- DESCRIPTION -->

<label>
    Problem Description *
</label>

<textarea
    name="description"
    id="description"
    placeholder="Describe the problem..."
    required
></textarea>



<!-- EXPECTED SOLUTION -->

<label>
    Expected Solution
</label>

<textarea
    name="expectedSolution"
    placeholder="What solution do you expect?"
></textarea>



<!-- BENEFICIARIES -->

<label>
    Beneficiaries
</label>

<input
    type="text"
    name="beneficiaries"
    placeholder="Example: 500 families"
>



<!-- IMAGE -->

<label>
    Upload Problem Image
</label>

<input
    type="file"
    name="problemImage"
    accept="image/*"
>



<!-- AI ANALYZE -->

<button
    type="button"
    id="aiButton"
>

🤖 Analyze Problem with AI

</button>



<!-- AI RESULT -->

<div id="aiResult">

<div class="ai-title">
    🤖 AI Analysis Result
</div>


<div class="ai-item">

Category:

<span
    id="aiCategory"
    class="ai-badge"
>
    -
</span>

</div>


<div class="ai-item">

Priority:

<span
    id="aiPriority"
    class="ai-badge"
>
    -
</span>

</div>


<div class="ai-item">

Confidence:

<span
    id="aiConfidence"
    class="ai-badge"
>
    -
</span>

</div>

</div>



<!-- DUPLICATE CHECK -->

<button
    type="button"
    id="duplicateButton"
>

🔍 Check for Duplicate Problem

</button>



<!-- DUPLICATE RESULT -->

<div id="duplicateResult">

<div
    id="duplicateTitle"
    class="duplicate-title"
>
    -
</div>

<div id="duplicateDetails">
    -
</div>

</div>



<!-- SUBMIT -->

<button
    type="submit"
>

Submit Problem

</button>


</form>



<div id="message"></div>


</div>

</div>



<script>


// ======================================
// ELEMENTS
// ======================================

const form =
    document.getElementById(
        "problemForm"
    );

const message =
    document.getElementById(
        "message"
    );

const aiButton =
    document.getElementById(
        "aiButton"
    );

const duplicateButton =
    document.getElementById(
        "duplicateButton"
    );

const aiResult =
    document.getElementById(
        "aiResult"
    );

const duplicateResult =
    document.getElementById(
        "duplicateResult"
    );

const aiCategory =
    document.getElementById(
        "aiCategory"
    );

const aiPriority =
    document.getElementById(
        "aiPriority"
    );

const aiConfidence =
    document.getElementById(
        "aiConfidence"
    );

const duplicateTitle =
    document.getElementById(
        "duplicateTitle"
    );

const duplicateDetails =
    document.getElementById(
        "duplicateDetails"
    );


// ======================================
// AI DATA
// ======================================

let aiData = null;

let duplicateData = null;


// ======================================
// AI ANALYSIS
// ======================================

aiButton.addEventListener(
    "click",
    async function() {

        const title =
            document
                .getElementById("title")
                .value
                .trim();

        const description =
            document
                .getElementById("description")
                .value
                .trim();

        const impact =
            document
                .getElementById("impact")
                .value;


        if (
            !title ||
            !description
        ) {

            alert(
                "Please enter Problem Title and Description first."
            );

            return;

        }


        aiButton.disabled =
            true;

        aiButton.innerText =
            "🤖 AI Analyzing...";


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/ai/analyze",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                title,

                                description,

                                impact

                            })

                    }
                );


            const result =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    result.message ||
                    "AI analysis failed"
                );

            }


            aiData =
                result;


            aiCategory.innerText =
                result.category;

            aiPriority.innerText =
                result.priority;

            aiConfidence.innerText =
                result.confidence +
                "%";


            aiResult.style.display =
                "block";


            // AUTO SELECT CATEGORY

            const categorySelect =
                document.getElementById(
                    "category"
                );


            const option =
                [
                    ...categorySelect.options
                ]
                .find(
                    option =>
                        option.value ===
                        result.category
                );


            if (option) {

                categorySelect.value =
                    result.category;

            }


        } catch (error) {

            alert(
                "AI Error: " +
                error.message
            );

        }


        aiButton.disabled =
            false;

        aiButton.innerText =
            "🤖 Analyze Problem with AI";

    }
);


// ======================================
// DUPLICATE CHECK
// ======================================

duplicateButton.addEventListener(
    "click",
    async function() {

        const title =
            document
                .getElementById("title")
                .value
                .trim();

        const description =
            document
                .getElementById("description")
                .value
                .trim();


        if (
            !title ||
            !description
        ) {

            alert(
                "Please enter Problem Title and Description first."
            );

            return;

        }


        duplicateButton.disabled =
            true;

        duplicateButton.innerText =
            "🔍 Checking...";


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/ai/duplicate-check",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                title,

                                description

                            })

                    }
                );


            const result =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    result.message ||
                    "Duplicate check failed"
                );

            }


            duplicateData =
                result;


            duplicateResult.style.display =
                "block";


            if (
                result.isDuplicate
            ) {

                duplicateResult.className =
                    "duplicate";


                duplicateTitle.innerText =
                    "⚠️ Possible Duplicate Problem";


                if (
                    result.similarProblem
                ) {

                    duplicateDetails.innerHTML =

                        "Similarity: <strong>" +
                        result.similarity +
                        "%</strong><br><br>" +

                        "Similar Problem: <strong>" +
                        escapeHTML(
                            result.similarProblem.title
                        ) +
                        "</strong><br>" +

                        "Category: " +
                        escapeHTML(
                            result.similarProblem.category ||
                            "N/A"
                        ) +
                        "<br>" +

                        "District: " +
                        escapeHTML(
                            result.similarProblem.district ||
                            "N/A"
                        ) +
                        "<br>" +

                        "Status: " +
                        escapeHTML(
                            result.similarProblem.status ||
                            "N/A"
                        );

                }

            } else {

                duplicateResult.className =
                    "unique";


                duplicateTitle.innerText =
                    "✅ No Strong Duplicate Found";


                duplicateDetails.innerHTML =

                    "Similarity with the closest existing problem: <strong>" +
                    result.similarity +
                    "%</strong><br><br>" +

                    "This problem appears sufficiently different from existing submissions.";

            }


        } catch (error) {

            alert(
                "Duplicate Check Error: " +
                error.message
            );

        }


        duplicateButton.disabled =
            false;

        duplicateButton.innerText =
            "🔍 Check for Duplicate Problem";

    }
);


// ======================================
// SUBMIT PROBLEM
// ======================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        message.style.display =
            "none";


        // ==================================
        // LOGIN CHECK
        // ==================================

        const user =
            JSON.parse(
                localStorage.getItem(
                    "user"
                )
            );


        if (!user) {

            alert(
                "Please login before submitting a problem."
            );


            window.location.href =
                "../login.html";


            return;

        }


        // ==================================
        // FORM DATA
        // ==================================

        const formData =
            new FormData(
                form
            );


        // USER

        formData.append(
            "submittedBy",
            user.email
        );


        // ==================================
        // AI DATA
        // ==================================

        if (aiData) {

            formData.append(
                "aiCategory",
                aiData.category
            );

            formData.append(
                "aiPriority",
                aiData.priority
            );

            formData.append(
                "aiConfidence",
                aiData.confidence
            );

        }


        // ==================================
        // DUPLICATE DATA
        // ==================================

        if (duplicateData) {

            formData.append(
                "duplicateChecked",
                "true"
            );

            formData.append(
                "isDuplicate",
                duplicateData.isDuplicate
            );

            formData.append(
                "duplicateSimilarity",
                duplicateData.similarity
            );


            if (
                duplicateData.similarProblem
            ) {

                formData.append(
                    "similarProblemId",
                    duplicateData
                        .similarProblem
                        .id
                );


                formData.append(
                    "similarProblemTitle",
                    duplicateData
                        .similarProblem
                        .title
                );

            }

        }


        // ==================================
        // SEND
        // ==================================

        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/problems",
                    {

                        method:
                            "POST",

                        body:
                            formData

                    }
                );


            const result =
                await response.json();


            if (
                !response.ok
            ) {

                throw new Error(
                    result.message ||
                    "Submission failed"
                );

            }


            // SUCCESS

            message.className =
                "success";


            message.style.display =
                "block";


            message.innerHTML =
                "✅ Problem submitted successfully!";


            form.reset();


            aiResult.style.display =
                "none";


            duplicateResult.style.display =
                "none";


            aiData =
                null;


            duplicateData =
                null;


            setTimeout(
                function() {

                    window.location.href =
                        "my-problems.html";

                },
                1200
            );


        } catch (error) {

            message.className =
                "error";


            message.style.display =
                "block";


            message.innerHTML =
                "❌ " +
                error.message;

        }

    }
);


// ======================================
// HTML SECURITY
// ======================================

function escapeHTML(text) {

    return String(text || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
